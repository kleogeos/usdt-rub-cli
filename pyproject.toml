[project]
name = "usdt-rub-cli"
version = "1.0.0"
description = "Estimate RUB received for USDT via P2P, exchanger, or a custom spread. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
usdt-rub = "usdt_rub:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["usdt_rub"]
